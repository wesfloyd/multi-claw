services:
  openclaw-gateway:
    image: alpine/openclaw:latest
    container_name: openclaw-gateway
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    environment:
      # API Keys from .env
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-ollama-local}
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
    extra_hosts:
      # Allow container to reach Ollama running on Mac host
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist OpenClaw state to ~/.openclaw/
      - ${HOME}/.openclaw:/home/node/.openclaw
      # Optional: named volume for container home
      # - ${OPENCLAW_HOME_VOLUME:-openclaw_home}:/root
    restart: unless-stopped
    networks:
      - openclaw-network

networks:
  openclaw-network:
    driver: bridge

# Optional: define named volume if using OPENCLAW_HOME_VOLUME
# volumes:
#   openclaw_home:
#     driver: local
